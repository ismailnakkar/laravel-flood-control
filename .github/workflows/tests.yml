name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: [prefer-lowest, prefer-stable]
        pulse: [with]
        include:
          # laravel/pulse is a suggestion, so the suite has to pass without it too.
          - { php: '8.5', deps: prefer-stable, pulse: without }

    name: PHP ${{ matrix.php }} · ${{ matrix.deps }} · ${{ matrix.pulse }} pulse

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - if: matrix.pulse == 'without'
        run: composer remove --dev laravel/pulse --no-update --no-interaction

      - run: composer update --${{ matrix.deps }} --prefer-dist --no-interaction --no-progress

      - if: matrix.php == '8.5' && matrix.deps == 'prefer-stable' && matrix.pulse == 'with'
        run: vendor/bin/pint --test

      - run: vendor/bin/phpunit
