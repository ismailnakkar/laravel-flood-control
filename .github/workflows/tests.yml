name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        deps: [prefer-lowest, prefer-stable]
        pulse: [with]
        exclude:
          # Laravel 13 needs PHP 8.3.
          - { php: '8.2', laravel: '13.*' }
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
          # laravel/pulse is a suggestion, so the suite has to pass without it too.
          - { php: '8.5', laravel: '13.*', testbench: '11.*', deps: prefer-stable, pulse: without }

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.deps }} · ${{ matrix.pulse }} pulse

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - if: matrix.pulse == 'without'
        run: composer remove --dev laravel/pulse --no-update --no-interaction

      # Testbench picks the Laravel major; prefer-lowest installs composer.json's own floors.
      - run: composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update

      # The lowest legs install the declared Laravel floors, which have security advisories; malware and
      # abandoned-package blocking stay on.
      - run: composer update --${{ matrix.deps }} --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: ${{ matrix.deps == 'prefer-lowest' && '0' || '1' }}

      - if: matrix.php == '8.5' && matrix.laravel == '13.*' && matrix.deps == 'prefer-stable' && matrix.pulse == 'with'
        run: vendor/bin/pint --test

      - if: matrix.php == '8.5' && matrix.laravel == '13.*' && matrix.deps == 'prefer-stable' && matrix.pulse == 'with'
        run: composer analyse

      - run: vendor/bin/phpunit
